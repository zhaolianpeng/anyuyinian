version: '3.8'

services:
  # 后端API服务
  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "80:80"
    environment:
      - GIN_MODE=release
      - PORT=80
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=your_password
      - DB_NAME=anyuyinian
      - WX_APP_ID=wx101090677bd5219e
      - WX_APP_SECRET=your_app_secret
      - WECHAT_PAY_APP_ID=wx101090677bd5219e
      - WECHAT_PAY_MCH_ID=1726638701
      - WECHAT_PAY_MCH_KEY=JQzOCB8doIdgaUjAobELsk9nTyxdKhat
      - WECHAT_PAY_NOTIFY_URL=https://your-domain.com/api/payment/notify
      - WECHAT_PAY_ENVIRONMENT=production
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - app-network

  # MySQL数据库
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=your_password
      - MYSQL_DATABASE=anyuyinian
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/migration:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    restart: unless-stopped
    networks:
      - app-network

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
